<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stickman Studio</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --line:#e3e6ea; --line-strong:#cdd3da;
    --ink:#1b1f24; --ink-2:#57606a; --ink-3:#8b949e;
    --accent:#2f6feb; --accent-ink:#1a4fbf; --accent-soft:#eaf1ff;
    --ok:#1a7f37; --ok-soft:#e6f4ea;
    --bad:#c0392b; --bad-soft:#fdeceb;
    --warn:#9a6700; --warn-soft:#fff8e1;
    --radius:10px;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    display:flex;align-items:center;gap:12px;
    padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:10;
  }
  header h1{font-size:15px;margin:0;font-weight:650;letter-spacing:-.01em}
  header .sub{color:var(--ink-3);font-size:12px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:0 0 auto}
  .dot.live{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
  .dot.busy{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
  .dot.dead{background:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
  .spacer{flex:1}
  main{
    display:grid;grid-template-columns:minmax(340px,420px) 1fr;
    gap:18px;padding:18px 20px 40px;align-items:start;max-width:1560px;margin:0 auto;
  }
  @media (max-width:1080px){main{grid-template-columns:1fr}}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;
  }
  .card + .card{margin-top:14px}
  .card h2{
    font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);
    margin:0 0 10px;font-weight:650;
  }
  textarea{
    width:100%;min-height:96px;resize:vertical;padding:11px 12px;
    border:1px solid var(--line-strong);border-radius:8px;font:inherit;color:var(--ink);
    background:#fff;outline:none;
  }
  textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{
    font-size:12px;padding:4px 9px;border:1px solid var(--line-strong);
    border-radius:999px;background:#fff;color:var(--ink-2);cursor:pointer;
  }
  .chip:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
  .row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:14px}
  label.opt{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);cursor:pointer}
  input[type=number]{
    width:74px;padding:5px 8px;border:1px solid var(--line-strong);border-radius:6px;
    font:inherit;font-size:13px;
  }
  .btnrow{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
  button{
    font:inherit;font-weight:560;padding:9px 15px;border-radius:8px;cursor:pointer;
    border:1px solid var(--line-strong);background:#fff;color:var(--ink);
  }
  button:hover:not(:disabled){border-color:var(--line-strong);background:#fafbfc}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover:not(:disabled){background:var(--accent-ink);border-color:var(--accent-ink)}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.tiny{padding:5px 10px;font-size:12.5px}
  .stage{margin-top:14px;display:none}
  .stage.on{display:block}
  .bar{height:6px;border-radius:999px;background:#eceff3;overflow:hidden}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s ease}
  .stagetext{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2);margin-bottom:7px}
  video{width:100%;border-radius:8px;background:#0d1117;display:block}
  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tab{
    font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line-strong);
    background:#fff;color:var(--ink-2);cursor:pointer;
  }
  .tab.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  .badge{
    display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;
    padding:3px 9px;border-radius:999px;
  }
  .badge.ok{background:var(--ok-soft);color:var(--ok)}
  .badge.bad{background:var(--bad-soft);color:var(--bad)}
  .badge.warn{background:var(--warn-soft);color:var(--warn)}
  .defect{
    border-left:3px solid var(--line-strong);padding:7px 0 7px 11px;margin:8px 0;
    font-size:13px;color:var(--ink-2);
  }
  .defect.hard{border-left-color:var(--bad)}
  .defect.timing{border-left-color:var(--warn)}
  .defect code{font-family:var(--mono);font-size:12px;color:var(--ink);background:#f2f4f7;
    padding:1px 5px;border-radius:4px}
  pre{
    font-family:var(--mono);font-size:11.5px;line-height:1.45;background:#f7f8fa;
    border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;
    max-height:340px;margin:0;color:#24292f;
  }
  .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
  .meta div{background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:9px 11px}
  .meta b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--ink-3);font-weight:650;margin-bottom:3px}
  .meta span{font-family:var(--mono);font-size:13px}
  .empty{color:var(--ink-3);font-size:13px;padding:26px 4px;text-align:center}
  .err{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:11px;
    font-size:13px;font-family:var(--mono);white-space:pre-wrap;word-break:break-word}
  .note{font-size:12px;color:var(--ink-3);margin-top:9px}
  details summary{cursor:pointer;font-size:12.5px;color:var(--ink-2);margin-top:10px}
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>Stickman Studio</h1>
  <span class="sub" id="sub">connecting…</span>
  <span class="spacer"></span>
  <span class="sub" id="hint"></span>
</header>

<main>
  <!-- ---------------- left: controls ---------------- -->
  <section>
    <div class="card">
      <h2>Describe the shot</h2>
      <textarea id="prompt" placeholder="e.g. two stickmen exchange punches, then one gets knocked down and gets back up"></textarea>
      <div class="chips" id="chips"></div>

      <div class="row">
        <label class="opt"><input type="checkbox" id="sd" /> SD 512 (fast)</label>
        <label class="opt"><input type="checkbox" id="sound" checked /> Sound</label>
        <label class="opt"><input type="checkbox" id="slowmo" checked /> 0.5× slow-mo</label>
        <label class="opt">seed <input type="number" id="seed" value="0" /></label>
      </div>
      <div class="row">
        <label class="opt" title="Also block on timing debt (linear easing / missing anticipation)">
          <input type="checkbox" id="stricttiming" /> strict timing
        </label>
      </div>

      <div class="btnrow">
        <button id="btnRender" class="primary">Render</button>
        <button id="btnPreview">Preview digest</button>
        <button id="btnStop" disabled>Reset</button>
      </div>

      <div class="stage" id="stage">
        <div class="stagetext"><span id="stageName">working…</span><span id="stageTime"></span></div>
        <div class="bar"><i id="bar"></i></div>
      </div>
      <div class="note" id="note"></div>
    </div>

    <div class="card" id="previewCard" style="display:none">
      <h2>Pre-render digest</h2>
      <div id="previewBody"></div>
    </div>
  </section>

  <!-- ---------------- right: output ---------------- -->
  <section>
    <div class="card">
      <h2>Clip</h2>
      <div class="tabs" id="tabs" style="display:none">
        <button class="tab active" data-v="main">Normal</button>
        <button class="tab" data-v="slowmo">0.5× slow-mo</button>
        <button class="tab" data-v="silent">Silent</button>
      </div>
      <video id="video" controls playsinline></video>
      <div class="empty" id="videoEmpty">Nothing rendered yet — describe a shot and hit Render.</div>
      <div class="meta" id="meta" style="margin-top:14px;display:none"></div>
    </div>

    <div class="card">
      <h2>SceneDoctor</h2>
      <div id="doctor"><div class="empty">No diagnosis yet.</div></div>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const state = { jobId: null, timer: null, last: null, variant: "main" };

// ---------- health + host capabilities ----------
async function health(){
  try{
    const r = await fetch("/api/health");
    const j = await r.json();
    $("dot").className = "dot live";
    $("sub").textContent = "engine ready";
    const caps = j.capabilities || {};
    // The host tells the UI how to behave (a 0.1-CPU container wants SD + short clips).
    if(caps.default_sd){ $("sd").checked = true; }
    const bits = [];
    if(caps.max_frames) bits.push("max " + Math.round(caps.max_frames/24) + "s per clip");
    if(caps.default_sd) bits.push("SD mode");
    $("hint").textContent = bits.length ? "host limits: " + bits.join(" · ") : "";
    if(caps.max_frames){
      $("note").textContent = "This host renders short clips. Long prompts will be refused.";
    }
  }catch(e){
    $("dot").className = "dot dead";
    $("sub").textContent = "server unreachable";
  }
}

// ---------- examples ----------
async function loadExamples(){
  try{
    const j = await (await fetch("/api/examples")).json();
    const box = $("chips");
    box.innerHTML = "";
    (j.examples || []).slice(0, 12).forEach(p => {
      const b = document.createElement("span");
      b.className = "chip"; b.textContent = p;
      b.onclick = () => { $("prompt").value = p; };
      box.appendChild(b);
    });
  }catch(e){}
}

// ---------- report rendering ----------
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function renderDoctor(report){
  const box = $("doctor");
  if(!report){ box.innerHTML = '<div class="empty">No diagnosis yet.</div>'; return; }
  const hard = report.hard || [], timing = report.timing || [], warn = report.warn || [];
  let h = "";
  h += '<div style="margin-bottom:12px">' +
       (report.passed
          ? '<span class="badge ok">✓ PASSED — safe to render</span>'
          : '<span class="badge bad">✕ BLOCKED — ' + hard.length + ' hard defect(s)</span>') +
       (timing.length ? ' <span class="badge warn">' + timing.length + ' timing debt</span>' : '') +
       '</div>';
  hard.forEach(d => {
    h += '<div class="defect hard"><code>' + esc(d.code) + '</code> — ' + esc(d.message || "") + '</div>';
  });
  if(timing.length){
    h += '<div style="font-size:12px;color:var(--ink-3);margin:12px 0 2px">TIMING DEBT — the Phase-2 queue (advisory, does not block)</div>';
    timing.forEach(d => {
      h += '<div class="defect timing"><code>' + esc(d.code) + '</code> — ' + esc(d.message || "") + '</div>';
    });
  }
  warn.forEach(d => {
    h += '<div class="defect"><code>' + esc(d.code) + '</code> — ' + esc(d.message || "") + '</div>';
  });
  if(!hard.length && !timing.length && !warn.length){
    h += '<div class="note">No defects reported.</div>';
  }
  if(hard.length){
    const codes = [...new Set(hard.map(d => d.code))];
    h += '<div class="btnrow"><button class="tiny" id="btnForce">Render anyway (excuse ' +
         esc(codes.join(", ")) + ')</button></div>';
    box.innerHTML = h;
    $("btnForce").onclick = () => doRender(codes.join(","));
    return;
  }
  box.innerHTML = h;
}

function renderMeta(res){
  const m = $("meta");
  const counts = res.audio_counts || {};
  const rows = [
    ["mode", res.mode || "—"],
    ["actors", res.n_person ?? "—"],
    ["frames", res.T ?? "—"],
    ["duration", (res.duration_seconds ? res.duration_seconds.toFixed(2) : "—") + "s"],
    ["audio", counts.footsteps != null
        ? `${counts.footsteps} steps / ${counts.whooshes} whoosh / ${counts.impacts} impact`
        : "—"],
  ];
  m.innerHTML = rows.map(([k,v]) =>
    `<div><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join("");
  m.style.display = "grid";
}

// ---------- preview (no render) ----------
async function doPreview(){
  const prompt = $("prompt").value.trim();
  if(!prompt) return;
  $("previewCard").style.display = "block";
  $("previewBody").innerHTML = '<div class="empty">planning…</div>';
  try{
    const r = await fetch("/api/plan", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ prompt, seed: +$("seed").value || 0 })
    });
    const j = await r.json();
    if(!j.ok){ $("previewBody").innerHTML = '<div class="err">' + esc(j.error||"plan failed") + '</div>'; return; }
    renderDoctor(j.report);
    $("previewBody").innerHTML =
      '<pre>' + esc(j.digest || "(no digest)") + '</pre>' +
      '<div class="note">' + esc(j.mode) + ' · ' + j.n_person + ' actor(s) · ' +
      j.T + ' frames · ' + (j.duration_seconds||0).toFixed(2) + 's</div>';
  }catch(e){
    $("previewBody").innerHTML = '<div class="err">' + esc(String(e)) + '</div>';
  }
}

// ---------- render ----------
async function doRender(allow){
  const prompt = $("prompt").value.trim();
  if(!prompt) return;
  $("btnRender").disabled = true;
  $("btnPreview").disabled = true;
  $("dot").className = "dot busy";
  $("stage").classList.add("on");
  $("note").textContent = "";
  setStage("queued", 0);
  try{
    const r = await fetch("/api/render", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        prompt,
        sd: $("sd").checked,
        sound: $("sound").checked,
        slowmo: $("slowmo").checked,
        strict_timing: $("stricttiming").checked,
        seed: +$("seed").value || 0,
        allow: allow || null,
      })
    });
    const j = await r.json();
    if(!j.ok){ throw new Error(j.error || "render failed to start"); }
    state.jobId = j.job_id;
    state.timer = setInterval(poll, 500);
  }catch(e){
    setStage("error", 1);
    $("note").innerHTML = '<span style="color:var(--bad)">' + esc(String(e)) + '</span>';
    resetButtons();
  }
}

function setStage(stage, frac){
  $("stageName").textContent = stage;
  $("bar").style.width = Math.round(frac * 100) + "%";
}

async function poll(){
  if(!state.jobId) return;
  let j;
  try{ j = await (await fetch("/api/job/" + state.jobId)).json(); }
  catch(e){ return; }
  setStage(j.stage + (j.state === "running" ? "…" : ""), j.progress || 0);
  $("stageTime").textContent = (j.elapsed ? j.elapsed.toFixed(1) + "s" : "");
  if(j.state === "running" || j.state === "queued") return;

  clearInterval(state.timer); state.timer = null;
  resetButtons();
  const res = j.result || {};
  renderDoctor(res.report);

  if(j.state === "done" && res.video){
    state.last = res;
    $("dot").className = "dot live";
    $("tabs").style.display = "flex";
    $("videoEmpty").style.display = "none";
    loadVariant("main");
    renderMeta(res);
    $("note").textContent = "Rendered in " + (j.elapsed||0).toFixed(1) +
      "s — edit a word and render again to compare.";
  } else if(j.state === "blocked"){
    $("dot").className = "dot dead";
    $("note").innerHTML = '<span style="color:var(--bad)">Blocked by SceneDoctor — see defects. ' +
      'Fix them, or use “Render anyway”.</span>';
  } else {
    $("dot").className = "dot dead";
    $("note").innerHTML = '<div class="err">' + esc(j.error || "unknown error") + '</div>';
  }
}

function loadVariant(v){
  state.variant = v;
  const id = state.jobId;
  const vid = $("video");
  vid.src = "/api/clip/" + id + "?v=" + v + "&t=" + Date.now();
  vid.load();
  document.querySelectorAll(".tab").forEach(t =>
    t.classList.toggle("active", t.dataset.v === v));
}

function resetButtons(){
  $("btnRender").disabled = false;
  $("btnPreview").disabled = false;
  $("btnStop").disabled = false;
}

// ---------- wire up ----------
$("btnRender").onclick = () => doRender(null);
$("btnPreview").onclick = doPreview;
$("btnStop").onclick = () => {
  if(state.timer){ clearInterval(state.timer); state.timer = null; }
  $("stage").classList.remove("on");
  $("video").removeAttribute("src"); $("video").load();
  $("videoEmpty").style.display = "block";
  $("tabs").style.display = "none";
  $("meta").style.display = "none";
  renderDoctor(null);
  $("previewCard").style.display = "none";
  $("note").textContent = "";
  $("dot").className = "dot live";
  resetButtons();
};
document.querySelectorAll(".tab").forEach(t =>
  t.onclick = () => loadVariant(t.dataset.v));

health(); loadExamples();
</script>
</body>
</html>

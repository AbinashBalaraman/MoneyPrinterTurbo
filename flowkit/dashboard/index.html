<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>dashboard</title>
    <script>
      // Pre-hydration theme: apply before first paint to avoid FOUC.
      // Default is dark (no visual change); `light` only when the user
      // previously toggled it, else follow prefers-color-scheme on first run.
      // Key must match ThemeToggle in src/App.tsx (`flowkit-theme`).
      (function () {
        try {
          var stored = localStorage.getItem('flowkit-theme');
          var theme = stored === 'light' ? 'light' : 'dark';
          if (theme === 'light') document.documentElement.classList.add('light');
          else document.documentElement.classList.add('dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
